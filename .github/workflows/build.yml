name: Build Stick Fury APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'StickFuryAndroid-project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          test -f StickFuryAndroid-project.zip
          unzip -q StickFuryAndroid-project.zip -d source
          test -f source/StickFuryAndroid/app/build.gradle

      - name: Build debug APK
        run: |
          cd source/StickFuryAndroid
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stick-Fury-APK
          path: source/StickFuryAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
